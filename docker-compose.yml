services:
  web:
    image: ${IMAGE_BASE}
    ports:
      - "13254:8080"
    environment:
      NOBITEX_TOKEN: ${NOBITEX_TOKEN}
      PROXY_URI: ${PROXY_URI}
      ECOGOLD_TOKEN: ${ECOGOLD_TOKEN}
      ECOGOLD_PASSWORD: ${ECOGOLD_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
